name: stripe
display_name: Stripe API
version: "1.0.0"

source:
  type: stripe
  resource: customers
  api:
    base_url: https://api.stripe.com
    timeout_seconds: 15
    retries: 3
  auth:
    type: bearer
    token_env: STRIPE_SECRET_KEY
  headers:
    Accept: application/json
    User-Agent: standardized-api-connector/1.0

pipeline:
  format: jsonl

sink:
  type: local
  limit: 10
