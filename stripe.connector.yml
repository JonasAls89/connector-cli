schema_version: 1
name: stripe
display_name: Stripe customers
version: "1.0.0"
limit: 10

source:
  type: rest
  url: https://api.stripe.com/v1/customers
  records_path: data
  query:
    limit: 100
  auth:
    type: bearer
    token_env: STRIPE_SECRET_KEY
  pagination:
    type: cursor
    param: starting_after
    cursor_path: id
    has_more_path: has_more

pipeline:
  format: jsonl

sink:
  type: local
  path: stripe-customers.jsonl
