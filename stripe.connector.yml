name: stripe
display_name: Stripe API
version: "1.0.0"

api:
  base_url: https://api.stripe.com
  timeout_seconds: 15
  retries: 3

auth:
  type: bearer
  token_env: STRIPE_SECRET_KEY

headers:
  Accept: application/json
  User-Agent: standardized-api-connector/1.0

runtime:
  language: python
  package_name: stripe_connector
