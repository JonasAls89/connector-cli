[project]
name = "connector-cli"
version = "0.1.0"
description = "Configuration-driven REST data extraction"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1,<1",
    "pyyaml>=6.0.3",
]

[project.scripts]
connector-cli = "connector_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/connector_cli"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff==0.17.4",
    "bandit[toml]==1.9.4",
    "prek",
    "zizmor==1.31.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--cov=connector_cli", "--cov-report=term-missing"]

[tool.coverage.report]
fail_under = 90

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
