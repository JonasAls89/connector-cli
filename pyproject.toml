[project]
name = "connector-cli"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff==0.17.2",
    "bandit[toml]==1.9.4",
    "prek",
    "zizmor==1.31.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--cov={{ package_name }}", "--cov-report=term-missing"]

[tool.coverage.report]
fail_under = 90

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
